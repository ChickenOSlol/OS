.games-grid{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;overflow:auto}.game-card{background:#252c3f;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}.game-card:hover{border-color:var(--accent);transform:translateY(-1px)}.game-icon{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;margin-bottom:10px}.game-title{font-weight:700;font-size:13px}.game-sub{font-size:11px;color:var(--muted);margin-top:4px}.game-window{height:100%;display:flex;flex-direction:column;background:#111724}.game-main{flex:1;display:grid;place-items:center;padding:16px;overflow:auto}.game-box{width:min(580px,100%);min-height:330px;background:#1a2030;border:1px solid var(--line);border-radius:18px;padding:16px;position:relative}.game-canvas{display:block;width:100%;height:auto;background:#0d1320;border-radius:14px}.game-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.memory-cell{height:70px;border:0;border-radius:12px;background:#30374b;color:#fff;font-weight:800}.memory-cell.open{background:var(--accent)}

    fetch(url,{mode:'cors',cache:'no-store',headers:{'Accept':'application/json,text/plain,*/*'},signal:controller.signal,...init}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(resolve).catch(reject).finally(()=>clearTimeout(timer));

  return new Promise((resolve,reject)=>{
    const callbackName='__chickenAppleSearch_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script'),term=String(q||'').trim();

  async function loadIntoTab(t,url,opts={}){
    if(!t)return;

    }else if(t.frameel.parentElement!==t.page)t.page.append(t.frameel);

      // HTML proxy first, but never make the user wait on a dead public proxy:
      // after a short grace period the tab loads the target directly as a fast
      // navigation fallback. Proxy navigation remains the preferred path.
      try{

          fetchFileProxyHTML(url),
          new Promise((_,reject)=>setTimeout(()=>reject(new Error('proxy slow')),3200))
        ])}catch(proxyErr){

            const finish=()=>{if(t.loading===loading){loading.remove();t.loading=null;}};
            t.frameel.addEventListener('load',finish,{once:true});

            return;
          }catch{throw proxyErr}
        }
        t.fileDirect=false;
        proxyState.textContent='FILE PROXY'+(result?.cached?' • CACHE':'');
        proxyState.classList.remove('off');
        const proxiedDoc=buildFileProxyDocument(result.target,result.text,result.proxyBase,result.proxyMode);
        t.frameel.srcdoc=proxiedDoc;
        t.frameel.removeAttribute('src');

        if(opts.fromHistory!==true){

          t.history.push(url);
          t.hi=t.history.length-1;
        }

      }
      addr.value=url;renderTabs();updateNavButtons();

    }catch(e){
      loading?.remove();t.loading=null;showTabError(t,String(e?.message||e));
